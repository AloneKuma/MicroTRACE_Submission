# MicroTRACE Gap 2 audit/context kind config, generation "fault" (fault-v0).
# Same candidate policy as kind-config.yaml. Deliberate fault settings for
# AUD-TRUNCATION-OVERSIZE and AUD-LOSS-ROUTE only:
#   - truncation enabled with a 16 KiB per-event limit (batch limit = default);
#   - 1 MiB rotation with a single backup, so a stopped reader can be overrun.
# The policy file is not changed.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/policies/audit-policy.v0.yaml
            audit-log-path: /var/log/kubernetes/audit/audit.log
            audit-log-format: json
            audit-log-mode: blocking
            audit-log-maxsize: "1"
            audit-log-maxbackup: "1"
            audit-log-maxage: "0"
            audit-log-compress: "false"
            audit-log-truncate-enabled: "true"
            audit-log-truncate-max-event-size: "16384"
            audit-log-truncate-max-batch-size: "10485760"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: ./audit-policy.v0.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.v0.yaml
        readOnly: true
  - role: worker
