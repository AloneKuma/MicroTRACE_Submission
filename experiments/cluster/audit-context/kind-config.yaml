# MicroTRACE Gap 2 audit/context kind config, generation "main" (config-v0).
# Derived from ../kind-smoke.yaml. Mounts the exact spec/audit/audit-policy.v0.yaml
# (run.sh stages a byte-identical copy next to this file and checks its SHA-256
# inside the node). Every audit flag is pinned explicitly, including defaults.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-policy-file: /etc/kubernetes/policies/audit-policy.v0.yaml
            audit-log-path: /var/log/kubernetes/audit/audit.log
            audit-log-format: json
            audit-log-mode: blocking
            audit-log-maxsize: "100"
            audit-log-maxbackup: "10"
            audit-log-maxage: "0"
            audit-log-compress: "false"
            audit-log-truncate-enabled: "false"
          extraVolumes:
            - name: audit-policies
              hostPath: /etc/kubernetes/policies
              mountPath: /etc/kubernetes/policies
              readOnly: true
              pathType: DirectoryOrCreate
            - name: audit-logs
              hostPath: /var/log/kubernetes/audit
              mountPath: /var/log/kubernetes/audit
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: ./audit-policy.v0.yaml
        containerPath: /etc/kubernetes/policies/audit-policy.v0.yaml
        readOnly: true
  - role: worker
