// MicroTRACE Gap 1 schema v0: stream-control records and graph edges.
syntax = "proto3";

package microtrace.v0;

import "google/protobuf/timestamp.proto";
import "microtrace/v0/common.proto";

// Written by every producer instance to every partition it may write, by
// explicit partition number, at the heartbeat interval.
message Heartbeat {
  string producer_id = 1;
  string producer_instance = 2;
  string topic = 3;
  int32 partition = 4;
  // Promise: this instance will write no later record to this partition
  // with event_time earlier than low_watermark.
  google.protobuf.Timestamp low_watermark = 5;
  google.protobuf.Timestamp emitted_at = 6;
  uint64 producer_seq = 7;
}

enum CompletenessStatus {
  COMPLETENESS_STATUS_UNSPECIFIED = 0;
  NO_KNOWN_GAP = 1;
  INCOMPLETE = 2;
  // End-to-end delivery could not be established for the interval.
  DELIVERY_UNKNOWN = 3;
}

// Per-source, per-scope accounting for an interval (source.completeness.v0).
message SourceCompleteness {
  Source source = 1;
  // e.g. "node=<id>", "audit-collector=<id>", "partition=raw.audit.v0/3".
  string scope = 2;
  google.protobuf.Timestamp interval_start = 3;
  google.protobuf.Timestamp interval_end = 4;
  CompletenessStatus status = 5;
  repeated Gap gaps = 6;
  // Counter snapshot, e.g. "apiserver_audit_error_total", "dropped:file.read".
  map<string, uint64> counters = 7;
}

enum EdgeType {
  EDGE_TYPE_UNSPECIFIED = 0;
  OBSERVED = 1;
  CONFIRMED_WITNESS = 2;
  HYPOTHESIS = 3;
}

// Where a HYPOTHESIS edge came from. Neither origin is a confirmed link.
enum HypothesisOrigin {
  HYPOTHESIS_ORIGIN_UNSPECIFIED = 0;
  // A GO speculative path (Incident.speculative_paths; ENABLING_ONLY witness).
  HYPOTHESIS_ORIGIN_GO = 1;
  // Generated by the TGS from an analyst-selected template.
  HYPOTHESIS_ORIGIN_ANALYST = 2;
}

message GraphEdge {
  string edge_id = 1;
  EdgeType edge_type = 2;
  EntityRef source_node = 3;
  EntityRef target_node = 4;
  google.protobuf.Timestamp event_start = 5;
  google.protobuf.Timestamp event_end = 6;
  google.protobuf.Timestamp knowledge_time = 7;
  repeated string source_event_ids = 8;
  optional string witness_id = 9;
  optional string incident_id = 10;
  string decision_version = 11;
  // Set on HYPOTHESIS edges only.
  HypothesisOrigin hypothesis_origin = 12;
}
