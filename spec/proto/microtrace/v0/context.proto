// MicroTRACE Gap 1 schema v0: cluster-state history (context.cluster.v0).
// Watch observation time is knowledge time, not change time.
syntax = "proto3";

package microtrace.v0;

import "google/protobuf/timestamp.proto";
import "microtrace/v0/common.proto";

enum ChangeType {
  CHANGE_TYPE_UNSPECIFIED = 0;
  ADDED = 1;
  MODIFIED = 2;
  DELETED = 3;
  // Object seen in a list after a relist; intermediate changes are unknown.
  RELIST_SNAPSHOT = 4;
}

message ContainerStatusSummary {
  string name = 1;
  string container_id = 2;
  uint32 restart_count = 3;
  google.protobuf.Timestamp started_at = 4;
  string image_id = 5;
}

message PodSummary {
  string node_name = 1;
  repeated string pod_ips = 2;
  string service_account = 3;
  repeated ContainerStatusSummary containers = 4;
  repeated EntityRef owners = 5;
}

message RbacRule {
  repeated string api_groups = 1;
  repeated string resources = 2;
  repeated string resource_names = 3;
  repeated string verbs = 4;
  repeated string non_resource_urls = 5;
}

message RbacSubject {
  string kind = 1;
  string name = 2;
  string namespace = 3;
}

// Parsed RBAC object state used by the F2 effective-rights evaluator.
message RbacSummary {
  repeated RbacRule rules = 1;
  // ClusterRole aggregationRule label selectors, serialized.
  repeated string aggregation_selectors = 2;
  string role_ref_kind = 3;
  string role_ref_name = 4;
  repeated RbacSubject subjects = 5;
  // Object labels; a ClusterRole's labels decide which aggregationRule
  // selectors include it.
  map<string, string> labels = 6;
}

message ObjectObservation {
  string api_group = 1;
  string kind = 2;
  string namespace = 3;
  string name = 4;
  string uid = 5;
  // Opaque; compared only for equality and within one watch stream.
  string resource_version = 6;
  ChangeType change_type = 7;
  google.protobuf.Timestamp observed_time = 8;
  // Watch stream identity; order is defined only within one stream.
  string watch_stream_id = 9;
  uint64 watch_stream_seq = 10;
  oneof summary {
    PodSummary pod = 20;
    RbacSummary rbac = 21;
  }
  EvidenceRef object = 30;
}

enum WatchGapReason {
  WATCH_GAP_REASON_UNSPECIFIED = 0;
  // HTTP 410 Gone / expired resourceVersion followed by relist.
  GONE_410 = 1;
  DISCONNECT = 2;
  COLLECTOR_RESTART = 3;
}

// Interval over which intermediate changes of a resource type are unknown.
message WatchGap {
  string api_group = 1;
  string resource = 2;
  string namespace = 3;
  string last_resource_version = 4;
  string relist_resource_version = 5;
  google.protobuf.Timestamp gap_start = 6;
  google.protobuf.Timestamp gap_end = 7;
  WatchGapReason reason = 8;
  string watch_stream_id = 9;
}
