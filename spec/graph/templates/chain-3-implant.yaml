# TGS gap-analysis template (tgs-contract.md section 5). Shared task
# knowledge for both Exp. 5 investigators: finding types and tactics only,
# never instance values (UIDs, names, times, or which stage is missing).
# The sources that can supply each stage are derived from the rulebook.
template_version: tgs-template.v0
id: chain-3-implant
status: provisional     # until the dataset build fixes the Exp. 5 chain families
basis: docs/design/design-spec.md section 3, Chain 3
stages:
  - {id: unsigned-admission, finding_types: [E1], tactic: null, required: false}   # unmapped evidence, not a stage
  - {id: implant-write, finding_types: [E2], tactic: null, required: false}        # unmapped evidence, not a stage
  - {id: re-execution, finding_types: [E3], tactic: PERSISTENCE, required: true}
  - {id: data-transfer, finding_types: [H4], tactic: EXFILTRATION, required: true}
