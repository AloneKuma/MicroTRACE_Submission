      - {field: microtrace.v0.OffNodeDerived.pod_uid, source: normalizer, gap2: [CTX-POD-IP-REUSE]}
      - {field: microtrace.v0.OffNodeDerived.node_uid, source: normalizer, gap2: [OFFNODE-HOST-SIGNATURES]}
      - {field: microtrace.v0.OffNodeDerived.remote_class, source: normalizer, gap2: [OFFNODE-PATH-COVERAGE]}
    context_joins: [source address -> Pod UID or node host context (time-indexed address map), destination -> external]
    state: {kind: keyed, key: [SOURCE_ADDRESS], window: W_H5}
    parameters: [W_H5, rho_H5]
    predicate: >-
      For one source address S whose resolution is POD_ADDRESS or
      NODE_HOST_CONTEXT, a successful database read by S is followed within
      W_H5 by path-flow records from S to external destinations whose summed
      octets reach rho_H5 times the bytes the read returned. Both halves are
      observed off the source node; the agent joins them before publishing.
      "Followed" means the flow interval ends after the read's corrected event
      time plus both clock uncertainties.
    evidence_threshold: >-
      Suspected exfiltration attributed to a source address (a Pod or a node's
      host context), not a process; the byte check is a consistency test and
      does not show that the bytes sent are the bytes read.
    weaker_output: none
    abstain: [Source address AMBIGUOUS (overlapping holders or masquerade), bytes_returned not logged by the engine, Sampled flow records, Flow matches a declared host-component signature, Path-observer export gap overlapping the window.]
    emits: [source_address, source_address_class, pod_uid, node_uid, boot_id, db_read_event, path_flows, destination, bytes_read, octets_out]
    negative_controls: [Benign database read and egress from a Pod on the same node below rho_H5 or outside W_H5, Kubelet image pull from the node's host context, Egress of a declared hostNetwork Pod.]
    gap2: [OFFNODE-DBAUDIT-SOURCE, OFFNODE-PATH-COVERAGE, OFFNODE-FLOW-EXPORT, OFFNODE-HOST-SIGNATURES, CTX-POD-IP-REUSE]

witnesses:
  - type: network-flow
    class: direct
    status: specified
    join_key: FlowId or 5-tuple within uncertainty, connect->accept
    key_origin: {flow: sensor}
    window: W_w
    fields: [microtrace.v0.SocketDetail.flow, microtrace.v0.SocketDetail.local, microtrace.v0.SocketDetail.remote]
    gap2: [NODE-SOCKET-FLOW, NODE-ORIGIN-FORGERY]
  - type: request-identity
    class: direct
    status: conditional
    join_key: gateway-minted request ID shared by both findings; confirms only when request_id_origin is SENSOR. A propagated or client-supplied ID (origin WORKLOAD) raises q_w but never confirms.
    key_origin: {request_id: gateway-minted}
    window: W_w
    fields: [microtrace.v0.GatewayObservation.request_id, microtrace.v0.GatewayObservation.request_id_origin]
    gap2: [GW-STREAMED-SPLIT, GW-REQUEST-ID-ORIGIN]
  - type: credential-read-to-use
    class: direct
    status: conditional
    join_key: JTI of the read token version equals used_credential_id
    key_origin: {jti: sensor, used_credential_id: sensor}
    window: W_w
    fields: [microtrace.v0.TokenFileVersion.jti, microtrace.v0.FileIdentity.projected, microtrace.v0.AuditDerived.used_credential_id]
    gap2: [CRED-JTI-VERSION-INDEX, NODE-TOKEN-ROTATION, AUD-FIELDS-USEDTOKEN, AUD-ORIGIN-FORGERY]
  - type: process-ancestry
    class: direct
    status: specified
    join_key: source process is the target's process or an ancestor of it on the parent chain the sensor recorded at birth (proc.fork/proc.exec process and parent, per node and boot); shared lineage_id (process key of lineage root) is the index key, not the evidence; direction by node_seq; a chain broken by a lost birth is unresolved
    key_origin: {lineage_id: sensor}
    window: W_w
    fields: [microtrace.v0.RawEbpfRecord.lineage_root, microtrace.v0.RawEbpfRecord.process, microtrace.v0.RawEbpfRecord.parent, microtrace.v0.RawEbpfRecord.node_seq, microtrace.v0.EbpfDerived.lineage_id]
    gap2: [NODE-EXEC-LINEAGE, NODE-ORIGIN-FORGERY]
  - type: host-transition
    class: direct
    status: specified
    join_key: container lineage continuing into host namespaces on the same node, the host-side process being the source's process or a descendant of it on the recorded parent chain (as process-ancestry)
    key_origin: {lineage_root: sensor}
    window: W_w
    fields: [microtrace.v0.NamespaceDetail.after, microtrace.v0.NamespaceDetail.host_reference, microtrace.v0.RawEbpfRecord.lineage_root]
    gap2: [NODE-NS-TRANSITION]
  - type: host-context
    class: direct
    status: conditional
    join_key: (node identity, boot ID) of a host-level finding (C1b, or F1 at host scope) equals the node resolved for an off-node finding attributed to that node's host network context, within the node's degraded-trust epoch
    key_origin: {node_uid: sensor, boot_id: sensor}
    window: W_w
    fields: [microtrace.v0.OffNodeDerived.source_address_class, microtrace.v0.OffNodeDerived.node_uid, microtrace.v0.OffNodeDerived.boot_id, microtrace.v0.OffNodeDerived.host_component_match, microtrace.v0.RawEbpfRecord.node_id, microtrace.v0.RawEbpfRecord.boot_id]
    gap2: [OFFNODE-HOST-SIGNATURES, OFFNODE-PATH-COVERAGE, NODE-NS-TRANSITION]
  - type: admission-instance
    class: direct
    status: conditional
    join_key: admission resource_uid equals the later event's Pod UID; dry-run excluded
    key_origin: {resource_uid: sensor, pod_uid: sensor}
    window: W_w
    fields: [microtrace.v0.AdmissionDecision.resource_uid, microtrace.v0.AdmissionDecision.dry_run, microtrace.v0.EbpfDerived.pod_uid]
    gap2: [KYV-POD-UID-DRYRUN]
  - type: control-plane-causality-instance
    class: direct
    status: conditional
    join_key: binding UID proven the sole grant path for the later operation by historical effective-rights evaluation
    key_origin: {binding_uid: sensor}
    window: W_w
    fields: [microtrace.v0.ObjectRef.uid, microtrace.v0.RbacSummary.subjects, microtrace.v0.RbacSummary.rules]
    gap2: [F2-HISTORICAL-RIGHTS]
  - type: control-plane-causality-class
    class: enabling
    status: specified
    join_key: a grant that could have authorized the later operation
    key_origin: {binding_uid: sensor}
    window: W_w
    fields: [microtrace.v0.ObjectRef.uid, microtrace.v0.RbacSummary.rules]
    gap2: [F2-HISTORICAL-RIGHTS]
  - type: image-class
    class: enabling
    status: specified
    join_key: same image digest, no Pod-UID binding
    key_origin: {image_digest: sensor}
    window: W_w
    fields: [microtrace.v0.AdmissionDecision.image_digests, microtrace.v0.ContainerStatusSummary.image_id]
    gap2: [KYV-POD-UID-DRYRUN]
