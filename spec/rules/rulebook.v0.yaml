      - {field: microtrace.v0.FileAccessDetail.bytes, source: ebpf, family: file.read, gap2: [NODE-FILE-READ-SUCCESS]}
      - {field: microtrace.v0.EbpfDerived.data_class, source: normalizer, gap2: [NODE-FILE-READ-SUCCESS]}
      - {field: microtrace.v0.SocketDetail.remote, source: ebpf, family: net.connect, gap2: [NODE-SOCKET-FLOW]}
      - {field: microtrace.v0.FlowCounter.bytes_out, source: ebpf, family: net.flow_bytes, gap2: [NODE-FLOW-COUNTERS]}
