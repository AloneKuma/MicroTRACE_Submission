  - id: H3
    name: bulk-secret-enumeration
    agent: H
    primary_tactic: CREDENTIAL_ACCESS
    status: specified
    inputs:
      - {field: microtrace.v0.AuditEvent.verb, source: audit, gap2: [AUD-PROVIDER-READS]}
      - {field: microtrace.v0.ObjectRef.resource, source: audit, gap2: [AUD-PROVIDER-READS]}
      - {field: microtrace.v0.ObjectRef.namespace, source: audit, gap2: [AUD-PROVIDER-READS]}
      - {field: microtrace.v0.ObjectRef.name, source: audit, gap2: [AUD-PROVIDER-READS]}
      - {field: microtrace.v0.AuditEvent.response_code, source: audit, gap2: [AUD-PROVIDER-READS]}
      - {field: microtrace.v0.AuditDerived.principal, source: normalizer, gap2: [AUD-POLICY-EFFECTIVE]}
    audit_requirements:
      - {verbs: [get, list, watch], group: "", resource: secrets, subresource: "", min_level: Metadata, stages: [ResponseComplete], authenticated: true}
