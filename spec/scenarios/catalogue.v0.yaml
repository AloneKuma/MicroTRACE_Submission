  # ========== A1: Injection Pattern ==========

  - id: a1_lidds_php_cwe434_upload
    kind: attack
    title: "A1 reproduced: PHP file upload (LID-DS PHP_CWE-434)"
    source:
      class: reproduced
      anchor:
        dataset: LID-DS
        location: "section 1: LID-DS 2021 PHP_CWE-434"
        record_ids: ["728b044cb2f4641ab7700c927fc84661"]
    author: "claude (automated draft, task p1-05)"
    adaptation_note: |
      LID-DS scenario: Apache web server handling PHP file upload from web browser.
      Kubernetes adaptation: Attacker Pod sends HTTP POST with multipart/form-data payload
      to a vulnerable service (replaces DVWA upload endpoint).
    roles:
      - name: external_attacker
        kind: external_client
        description: "HTTP client making the malicious upload request"
      - name: gateway_observer
        kind: namespace
        description: "Ingress or gateway observing the request"
      - name: vulnerable_service
        kind: internal_pod
        description: "Service Pod handling the file upload"
    steps:
      - step: 1
        action: http_request
        params:
          source_pod: external_attacker
          target_service: vulnerable_service
          method: POST
          path: "/api/upload"
          query_params: ""
          body_prefix_b64: "LS1XZWJLaXRGb3JtQm91bmRhcnk3NTc0YjQzMjg3ZjQ0YzMzCkNvbnRlbnQtRGlzcG9zaXRpb246IGZvcm0tZGF0YTsgbmFtZT0iZmlsZSI7IGZpbGVuYW1lPSJzaGVsbC5waHAiCkNvbnRlbnQtVHlwZTogYXBwbGljYXRpb24vb2N0ZXQtc3RyZWFtCgpQSFAgc2hlbGwgY29udGVudHMgaGVyZQotLVdlYktpdEZvcm1Cb3VuZGFyeTc1NzRiNDMyODdmNDRjMzMtLQ=="
        outcome: success
        expects:
          - finding: A2
            state: PRESENT
            reason: "2xx response to a matched upload/web-shell request"
          - finding: A1
            state: PRESENT
            reason: "POST request with suspicious multipart body triggers injection pattern P_A"
      - step: 2
        action: http_request
        params:
          source_pod: external_attacker
          target_service: vulnerable_service
          method: GET
          path: "/uploads/shell.php?cmd=id"
          query_params: ""
        outcome: success
        expects:
          - finding: A2
            state: PRESENT
            reason: "2xx response to a matched upload/web-shell request"
          - finding: A1
            state: PRESENT
            reason: "GET request with PHP shell invocation in path/query"
    links:
      - from: 1
        to: 2
        witness: REQUEST_IDENTITY
        expected: UNOBSERVABLE
        reason: "upload and web-shell call are two requests: causally linked, but no source records an instance witness between them"
    variants:
      - id: v1
        rulebook_shaped: true
      - id: v2
        rulebook_shaped: false

  - id: a1_kube_ids0_sqli
    kind: attack
    title: "A1 reproduced: SQL injection (Kube-IDS0 DVWA-SQLI)"
    source:
      class: reproduced
      anchor:
        dataset: Kube-IDS0
        location: "section 4: DVWA-SQLI"
    author: "claude (automated draft, task p1-05)"
    adaptation_note: |
      Kube-IDS0 scenario: HTTP GET requests with SQL injection payloads to DVWA.
      Kubernetes adaptation: Same technique, now routed through ingress/gateway.
    roles:
      - name: attacker_pod
        kind: internal_pod
      - name: vulnerable_app
        kind: internal_pod
    steps:
      - step: 1
        action: http_request
        params:
          source_pod: attacker_pod
          target_service: vulnerable_app
          method: GET
          path: "/api/search"
          query_params: "id=1 UNION ALL SELECT NULL,NULL,NULL"
        outcome: success
        expects:
          - finding: A2
            state: PRESENT
            reason: "2xx response to a matched SQL injection request"
          - finding: A1
            state: PRESENT
            reason: "UNION SELECT pattern matches P_A SQLi patterns"
      - step: 2
        action: http_request
        params:
          source_pod: attacker_pod
          target_service: vulnerable_app
          method: GET
          path: "/api/search"
          query_params: "id=1 CASE WHEN 1=1 THEN 'true' ELSE 'false' END"
        outcome: success
        expects:
          - finding: A2
            state: PRESENT
            reason: "2xx response to a matched SQL injection request"
          - finding: A1
            state: PRESENT
            reason: "CASE WHEN boolean blind SQL injection reaches the API; a detector without a CASE WHEN pattern misses it"
    links: []
    variants:
      - id: v1
        rulebook_shaped: true
      - id: v2
        rulebook_shaped: false

