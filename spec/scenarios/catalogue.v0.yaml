  # ========== E2: Post-Start Binary Write ==========

  - id: e2_cadets_implant_write
    kind: attack
    title: "E2 adapted: Executable implant write (CADETS)"
    source:
      class: adapted
      anchor:
        dataset: CADETS
        location: "section 2: CADETS sessions"
    author: "claude (automated draft, task p1-05)"
    adaptation_note: "Drakon implant write adapted to container filesystem"
    roles:
      - name: compromised_process
        kind: internal_pod
    steps:
      - step: 1
        action: file_write
        params:
          writer_process: compromised_process
          file_path: "/var/lib/implant.so"
          data: "ELF shared object binary"
          create_if_missing: true
        outcome: success
        expects:
          - finding: E2
            state: ABSENT
            reason: "File written but not yet executable: a non-executable write is an E2 negative control; the later chmod is the E2 opportunity"
      - step: 2
        action: make_executable
        params:
          process: compromised_process
          file_path: "/var/lib/implant.so"
          mode: "+x"
        outcome: success
        expects:
          - finding: E2
            state: PRESENT
            reason: "File made executable post-start"
    links:
      - from: 1
        to: 2
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "same-process continuity: both steps are one process (reported apart from ancestry)"
    variants:
