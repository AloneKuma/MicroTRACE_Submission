    author: "claude (multistep-chain-plan phase 2b, 2026-10-20)"
    adaptation_note: "One exploit process does the escalation and the escape (same-process hops); the host shell is its child (ancestry hop). A sibling metrics agent in the same Pod is a decoy."
    window_s: 45            # linked steps within W_w (60 s) with gap_of's x1.25 (D-22)
    roles:
      - name: compromised_pod
        kind: internal_pod
