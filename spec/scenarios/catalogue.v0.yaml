        reference: T1611
        url: "https://attack.mitre.org/techniques/T1611/"
    author: "claude (automated draft, task p1-05)"
    adaptation_note: "Capability-driven host namespace escape via setns"
    roles:
      - name: compromised_container
        kind: internal_pod
      - name: host_ns
        kind: node
    steps:
      - step: 1
        action: capability_gain
        params:
          process: compromised_container
          caps: [CAP_SYS_PTRACE, CAP_SYS_ADMIN]
        outcome: success
        expects:
          - finding: F1
            state: PRESENT
            reason: "Capabilities CAP_SYS_PTRACE and CAP_SYS_ADMIN gained"
          - finding: C1a
            state: PRESENT
      - step: 2
        action: namespace_escape
        params:
          process: compromised_container
          target_namespaces: [mnt, pid]
          method: setns
        outcome: success
        expects:
          - finding: C1a
            state: PRESENT
          - finding: C1b
            state: PRESENT
            reason: "Lineage now in host namespace"
    links:
      - from: 1
        to: 2
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "same-process continuity: both steps are one process (reported apart from ancestry)"
    variants:
      - id: v1
        rulebook_shaped: true
      - id: v2
        rulebook_shaped: false

