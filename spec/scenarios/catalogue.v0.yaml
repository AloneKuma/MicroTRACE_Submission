  - id: chain_exfil_first
    kind: attack
    title: "Chain: exfiltration first, then token theft and privilege escalation"
    source:
      class: external
      citation:
        source: "MITRE ATT&CK for Containers"
        reference: "T1041 Exfiltration Over C2 Channel; T1528 Steal Application Access Token; T1068 Exploitation for Privilege Escalation"
        url: "https://attack.mitre.org/matrices/enterprise/containers/"
    author: "claude (exp2-gaps-plan B4, 2026-10-22)"
    adaptation_note: "A stager exfiltrates first (H4), then its child steals the token (D1) and escalates (F1): tactic transitions run backwards along the ATT&CK order, H2 steps carry no tactic, and several paths compete for the escalation. A sibling decoy repeats H2, D1 and F1."
    window_s: 45            # linked steps within W_w (60 s), D-22
    roles:
      - name: compromised_pod
        kind: internal_pod
    steps:
      - step: 1
        action: process_exec
        params:
          parent_process: compromised_pod
          executable: /tmp/.s/stage
          argv: [/tmp/.s/stage]
        outcome: success
        expects: []
      - step: 2
        action: read_sensitive_file
        params:
          reader_process: "@step1.process"
          file_path: /etc/shadow
          data_class: system
        outcome: success
        expects: []          # the read is part of the later H4 opportunity
      - step: 3
        action: connect_external
        params:
          source_pod: compromised_pod
          source_process: "@step1.process"
          remote_ip: 198.51.100.77
          remote_port: 443
          protocol: tcp
        outcome: success
        expects:
          - finding: H2
            state: PRESENT
            reason: "New external destination"
      - step: 4
        action: egress_transfer
        intended_tactic: EXFILTRATION
        params:
          source_pod: compromised_pod
          source_process: "@step1.process"
          destination: 198.51.100.77
          bytes_out: 4096
          protocol: tcp
        outcome: success
        expects:
          - finding: H4
            state: PRESENT
            reason: "Sensitive read, external connect and bytes out in one lineage"
      - step: 5
        action: process_exec
        params:
          parent_process: "@step1.process"
          executable: /usr/local/bin/kubectl
          argv: [kubectl, get, pods]
        outcome: success
        expects: []
      - step: 6
        action: read_token_file
        intended_tactic: CREDENTIAL_ACCESS
        params:
          reader_process: "@step5.process"
          reader_executable: /usr/local/bin/kubectl
          token_file_path: /var/run/secrets/kubernetes.io/serviceaccount/token
        outcome: success
        expects:
          - finding: D1
            state: PRESENT
            reason: "Token read by an executable outside the workload's expected readers"
      - step: 7
        action: euid_to_root
        intended_tactic: PRIVILEGE_ESCALATION
        params:
          process: "@step5.process"
        outcome: success
        expects:
          - finding: F1
            state: PRESENT
            reason: "euid transitions from non-zero to 0 after the token theft"
      - step: 8
        action: connect_external
        params:
          source_pod: compromised_pod
          source_process: "@step5.process"
          remote_ip: 203.0.113.171
          remote_port: 443
          protocol: tcp
        outcome: success
        expects:
          - finding: H2
            state: PRESENT
            reason: "New external destination"
      - step: 9
        action: process_exec
        benign: true
        float: decoy
        params:
          parent_process: compromised_pod
          executable: /app/metrics-push
          argv: [/app/metrics-push]
        outcome: success
        expects: []
      - step: 10
        action: connect_external
        benign: true
        float: decoy
        params:
          source_pod: compromised_pod
          source_process: "@step9.process"
          remote_ip: 198.51.100.83
          remote_port: 443
          protocol: tcp
        outcome: success
        expects:
          - finding: H2
            state: PRESENT
            reason: "The metrics pusher connects to a destination new to the workload: a real unseen destination, not part of the chain"
      - step: 13
        action: read_token_file
        benign: true
        float: decoy
        params:
          reader_process: "@step9.process"
          reader_executable: /app/metrics-push
          token_file_path: /var/run/secrets/kubernetes.io/serviceaccount/token
        outcome: success
        expects:
          - finding: D1
            state: PRESENT
            reason: "The metrics pusher reads the token outside the expected readers: a real lookalike, not part of the chain"
      - step: 14
        action: euid_to_root
        benign: true
        float: decoy
        params:
          process: "@step9.process"
        outcome: success
        expects:
          - finding: F1
            state: PRESENT
            reason: "The metrics pusher's setuid helper runs as root outside the expected transitions: a real lookalike, not part of the chain"
    links:
      - from: 3
        to: 4
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "same-process continuity: the stager's connect carries the exfiltration"
      - from: 4
        to: 6
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "the token reader is a child of the stager that exfiltrated"
      - from: 3
        to: 6
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "the token reader is a child of the stager that connected out"
      - from: 4
        to: 7
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "the escalating process is a child of the stager that exfiltrated"
      - from: 3
        to: 7
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "the escalating process is a child of the stager that connected out"
      - from: 6
        to: 7
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "same-process continuity: the token reader escalates"
      - from: 6
        to: 8
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "same-process continuity: the token reader connects out"
      - from: 4
        to: 8
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "the connecting process is a child of the stager that exfiltrated"
      - from: 3
        to: 8
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "the connecting process is a child of the stager that connected out"
      - from: 4
        to: 10
        witness: PROCESS_ANCESTRY
        expected: ABSENT
        gap_of: [4, 8]
        reason: "decoy: the metrics pusher, a sibling of the stager in the same Pod, connects out"
        shared_keys: [pod_uid, lineage_id]
      - from: 4
        to: 13
        witness: PROCESS_ANCESTRY
        expected: ABSENT
        gap_of: [4, 6]
        reason: "decoy: the metrics pusher, a sibling of the stager, reads the token"
        shared_keys: [pod_uid, lineage_id]
      - from: 3
        to: 13
        witness: PROCESS_ANCESTRY
        expected: ABSENT
        reason: "decoy: the metrics pusher, a sibling of the stager, reads the token"
        shared_keys: [pod_uid, lineage_id]
      - from: 4
        to: 14
        witness: PROCESS_ANCESTRY
        expected: ABSENT
        gap_of: [4, 7]
        reason: "decoy: the metrics pusher, a sibling of the stager, gains root"
        shared_keys: [pod_uid, lineage_id]
      - from: 3
        to: 14
        witness: PROCESS_ANCESTRY
        expected: ABSENT
        reason: "decoy: the metrics pusher, a sibling of the stager, gains root"
        shared_keys: [pod_uid, lineage_id]
      - from: 3
        to: 10
        witness: PROCESS_ANCESTRY
        expected: ABSENT
        reason: "decoy: the metrics pusher, a sibling of the stager in the same Pod, connects out"
        shared_keys: [pod_uid, lineage_id]
      - from: 7
        to: 8
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "same-process continuity: kubectl, root after the escalation, connects out"
        ordering: false
      - from: 13
        to: 14
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "benign continuity: the metrics pusher reads the token, gains root and connects out, one benign process"
        ordering: false
      - from: 14
        to: 13
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "benign continuity: the metrics pusher reads the token, gains root and connects out, one benign process"
        ordering: false
      - from: 13
        to: 10
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "benign continuity: the metrics pusher reads the token, gains root and connects out, one benign process"
        ordering: false
      - from: 10
        to: 13
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "benign continuity: the metrics pusher reads the token, gains root and connects out, one benign process"
        ordering: false
      - from: 14
        to: 10
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "benign continuity: the metrics pusher reads the token, gains root and connects out, one benign process"
        ordering: false
      - from: 10
        to: 14
        witness: PROCESS_ANCESTRY
        expected: PRESENT
        reason: "benign continuity: the metrics pusher reads the token, gains root and connects out, one benign process"
        ordering: false
